<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Shop - Taste Our Flavour</title>
  <meta name="description"
    content="Coffee Shop – Fresh, organic coffee and delicious food. Taste our flavour every day.">
  <meta name="keywords" content="Html,List, Image Gallery, Animation, Layout">
  <meta property="og:title" content="Common">
  <meta property="og:description" content="Coffee Shop common template">
  <meta property="og:type" content="website">
  <meta property="og:image" content="./assets/Image/common/ico_header_logo.png">
  <meta property="og:site_name" content="header & footer">
  <meta property="og:url" content="https://cgm-myanmar.com/">

  <link rel="icon" href="./assets/Image/common/ico_logo.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&family=Spectral+SC:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="./assets/css/common.css">

  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/bundled/lenis.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</head>

<body>
  <header class="main-header" id="main-header">
    <div class="header-inner sec-wrap">
      <a href="./top.html" class="logo-link" aria-label="Coffee Shop Home">
        <img src="./assets/Image/common/ico_header_logo.png" alt="Coffee Shop Logo" width="100" height="75"
          class="logo-img">
      </a>
      <nav class="header-nav" aria-label="Main Navigation">
        <ul>
          <li><a href="./top.html" class="nav-link active">Home</a></li>
          <li><a href="./menu.html" class="nav-link">Menu</a></li>
          <li><a href="./about.html" class="nav-link">About</a></li>
          <li><a href="./contact.html" class="nav-link">Contact</a></li>
          <li>
            <div class="header-cta">
              <a href="./contact.html" class="btn-primary">Order Now !</a>
            </div>
          </li>
        </ul>
      </nav>

      <button class="hamburger" id="hamburger" aria-label="Open Menu" aria-expanded="false">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
      </button>
    </div>

    <ul class="mobile-nav" id="mobile-nav" aria-hidden="true">
      <li><a href="./top.html" class="mobile-nav-link">Home</a></li>
      <li><a href="./menu.html" class="mobile-nav-link">Menu</a></li>
      <li><a href="./about.html" class="mobile-nav-link">About</a></li>
      <li><a href="./contact.html" class="mobile-nav-link">Contact</a></li>
      <li>
        <div class="header-cta">
          <a href="./contact.html" class="btn-primary">Order Now !</a>
        </div>
      </li>
    </ul>
  </header>

  <main id="main-content">
  </main>

  <footer class="main-footer">
    <div class="footer-inner sec-wrap">
      <div class="footer-top">
        <div class="footer-brand" data-anim="fade-up" data-delay="0">
          <a href="./top.html" class="logo-link" aria-label="Coffee Shop Home">
            <img src="./assets/Image/common/ico_footer_logo.png" alt="Coffee Shop Logo" width="150" height="110"
              class="footer-logo-img">
          </a>
          <p class="footer-slogan">TASTE OUR FLAVOUR</p>
        </div>
        <div class="footer-top-wrap">
          <nav class="footer-nav" aria-label="Footer Navigation">
            <a href="./top.html" class="footer-nav-link" data-anim="fade-up" data-delay="0.1">Home</a>
            <a href="./about.html" class="footer-nav-link" data-anim="fade-up" data-delay="0.15">About</a>
            <a href="./menu.html" class="footer-nav-link" data-anim="fade-up" data-delay="0.2">Menu</a>
            <a href="./contact.html" class="footer-nav-link" data-anim="fade-up" data-delay="0.25">Contact</a>
          </nav>
          <hr>
          <div class="footer-box-wrapper">
            <div class="footer-newsletter" data-anim="fade-up" data-delay="0.3">
              <form class="newsletter-form" id="newsletter-form" onsubmit="return false;">
                <label for="newsletter-email" class="sr-only">Email Address</label>
                <input type="email" id="newsletter-email" name="email" class="newsletter-input"
                  placeholder="Enter your email here" required aria-label="Enter your email for newsletter">
                <button type="submit" class="newsletter-btn">Send</button>
              </form>
            </div>
            <ul class="footer-socials" data-anim="fade-up" data-delay="0.4">
              <li>
                <a href="https://facebook.com/theCoffeeShopYangon" class="social-link" aria-label="Facebook">
                  <img src="./assets/Image/common/ico_fb.png" alt="Facebook" width="30" height="30">
                </a>
              </li>
              <li>
                <a href="https://instagram.com/theCoffeeShopYangon" class="social-link" aria-label="Instagram">
                  <img src="./assets/Image/common/ico_instagram.png" alt="Instagram" width="30" height="30">
                </a>
              </li>
              <li>
                <a href="https://x.com/theCoffeeShopYangon" class="social-link" aria-label="X (Twitter)">
                  <img src="./assets/Image/common/ico_twitter.png" alt="X (Twitter)" width="30" height="30">
                </a>
              </li>
              <li>
                <a href="https://tiktok.com/@theCoffeeShopYangon" class="social-link" aria-label="TikTok">
                  <img src="./assets/Image/common/ico_tiktok.png" alt="TikTok" width="30" height="30">
                </a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </footer>
  <div class="footer-bottom">
    <p class="copyright">Copyright &copy;2026 All Rights Reserved</p>
  </div>

  <script src="./assets/js/common.js"></script>

</body>

</html>
